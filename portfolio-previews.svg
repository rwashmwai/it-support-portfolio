<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">SignalwiseAI and Intent portfolio mockups</title>
  <desc id="desc">Two illustrative cards: a fictional network report and a fictional mobile profile and messaging flow.</desc>
  <rect width="960" height="430" rx="24" fill="#eef2f5"/>
  <g font-family="system-ui, sans-serif" fill="#172e3e">
    <rect x="24" y="24" width="448" height="382" rx="18" fill="#fff"/>
    <rect x="488" y="24" width="448" height="382" rx="18" fill="#fff"/>
    <text x="50" y="66" font-size="18" font-weight="700" fill="#17546d">SIGNALWISEAI</text>
    <text x="514" y="66" font-size="18" font-weight="700" fill="#176247">INTENT</text>
    <text x="50" y="100" font-size="24" font-weight="700">Network audit report</text>
    <text x="514" y="100" font-size="24" font-weight="700">Profile and messaging</text>
    <text x="50" y="128" font-size="15">Fictional branch office • Sample finding</text>
    <text x="514" y="128" font-size="15">Fictional account • Example journey</text>
    <rect x="50" y="151" width="396" height="64" rx="10" fill="#e9f3f9"/>
    <rect x="50" y="224" width="396" height="64" rx="10" fill="#e9f3f9"/>
    <rect x="50" y="297" width="396" height="64" rx="10" fill="#e9f3f9"/>
    <text x="66" y="177" font-size="16" font-weight="700">Observation</text>
    <text x="66" y="199" font-size="14">Meeting-room devices lose connectivity.</text>
    <text x="66" y="250" font-size="16" font-weight="700">Impact</text>
    <text x="66" y="272" font-size="14">Calls in one room are affected.</text>
    <text x="66" y="323" font-size="16" font-weight="700">Next check</text>
    <text x="66" y="345" font-size="14">Review the change and verify connectivity.</text>
    <rect x="514" y="151" width="396" height="64" rx="10" fill="#e8f4ee"/>
    <rect x="514" y="224" width="396" height="64" rx="10" fill="#e8f4ee"/>
    <rect x="514" y="297" width="396" height="64" rx="10" fill="#e8f4ee"/>
    <text x="530" y="177" font-size="16" font-weight="700">01 / Sign in</text>
    <text x="530" y="199" font-size="14">Open a fictional test account.</text>
    <text x="530" y="250" font-size="16" font-weight="700">02 / Preview a profile</text>
    <text x="530" y="272" font-size="14">Add a short bio and check how it appears.</text>
    <text x="530" y="323" font-size="16" font-weight="700">03 / Send a message</text>
    <text x="530" y="345" font-size="14">Verify who can reopen the conversation.</text>
    <text x="50" y="384" font-size="13" fill="#445d6e">Illustrative mockup · No live data or product UI</text>
    <text x="514" y="384" font-size="13" fill="#445d6e">Illustrative mockup · No real accounts</text>
  </g>
</svg>
